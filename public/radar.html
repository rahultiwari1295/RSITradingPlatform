<div class="dev"><div class="st"><span>9:41</span><span>5G ▮▮▮</span></div>
<div class="nav" id="nav"><button class="ib" id="th" aria-label="Appearance">◐</button><b>Radar</b><button class="ib" id="fb" aria-label="Filters">☰<span class="badge" id="bg"></span></button></div>

<div class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search stock or company" aria-label="Search"><button id="cq" aria-label="Clear" hidden>⨂</button></div>

<script>
// Detect embedded mode in app
if(new URLSearchParams(location.search).get('embed')==='1'){document.documentElement.classList.add('embedded')}

// ===== Real API Client (Direct connection to /api/screener, /api/chart, /api/stock) =====
async function get(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error('API ' + r.status + ' from ' + url);
  return r.json();
}

// ===== App State =====
const $=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TABS=[
  ['success','Confirmed','breakout_status=SUCCESS'],
  ['retest','Retest','setup=breakout_retest'],
  ['near_breakout','Near','pattern_stage=NEAR_BREAKOUT'],
  ['failed','At risk','breakout_status=FAILED']
];
const SORTS=[['default','Closest to breakout'],['dna_score','DNA score'],['rsi','RSI'],['volume_ratio','Volume surge']];
let tab=0,pat='',sec='',mc='',fno=false,minS=0,sort='default',seq=0,tm,theme='dark',rows=[],sum=null,acc=null,dir=1;
const inr=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});

function setTheme(t){theme=t==='light'?'light':'dark';document.documentElement.dataset.theme=theme}
$('th').onclick=()=>{
  const next=theme==='dark'?'light':'dark';
  setTheme(next);
  if(window.parent&&window.parent!==window){window.parent.postMessage({type:'THEME_SYNC',theme:next},'*')}
};
const paramTheme=new URLSearchParams(location.search).get('theme');
if(paramTheme){setTheme(paramTheme)}
window.addEventListener('message',e=>{if(e.data?.type==='SET_THEME'&&e.data.theme){setTheme(e.data.theme)}});

// ----- segmented control
$('tabs').insertAdjacentHTML('beforeend',TABS.map(([k,l],i)=>`<button role="tab" data-i="${i}" aria-selected="${i==tab}">${l}<small id="c${i}">–</small></button>`).join(''));
$('tabs').onclick=e=>{const b=e.target.closest('[data-i]');if(!b||+b.dataset.i==tab)return;dir=+b.dataset.i>tab?1:-1;tab=+b.dataset.i;seg();load(true)};
function seg(){$('thumb').style.transform=`translateX(${tab*100}%)`;document.querySelectorAll('#tabs [data-i]').forEach(b=>b.setAttribute('aria-selected',+b.dataset.i==tab))}seg();

// ----- search
$('q').oninput=()=>{$('cq').hidden=!$('q').value;clearTimeout(tm);tm=setTimeout(()=>load(),300)};
$('cq').onclick=()=>{clearTimeout(tm);$('q').value='';$('cq').hidden=true;load()};

// ----- scroll chrome + physics impulse
let ls=0;const vis=new Set(),io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting?vis.add(e.target):vis.delete(e.target)));
$('scr').addEventListener('scroll',()=>{const t=$('scr').scrollTop,dv=t-ls;ls=t;$('nav').classList.toggle('sc',t>4);$('nav').classList.toggle('tt',t>40);$('seg').classList.toggle('sc',t>70);depth()},{passive:true});

// ----- scroll-driven depth engine (smooth 3D)
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;let raf=0,hot=null;
function reg(c){c._d={e:9,h:0,ht:0,p:0,pt:0,seen:0};io.observe(c);depth()}
function depth(){if(!raf)raf=requestAnimationFrame(frame)}
function frame(){raf=0;const sr=$('scr').getBoundingClientRect(),mid=sr.top+sr.height*.5,half=sr.height*.62;let busy=false;
vis.forEach(c=>{const d=c._d;if(!d)return;const r=c.getBoundingClientRect(),off=Math.max(-1.3,Math.min(1.3,(r.top+r.height/2-mid)/half));
if(d.e===9)d.e=still?off:Math.min(1.3,off+.5);
d.e+=(off-d.e)*.16;d.h+=(d.ht-d.h)*.14;d.p+=(d.pt-d.p)*.25;
if(!d.seen&&off<1.05){d.seen=1;c.querySelectorAll('.dot').forEach(x=>x.style.left=x.dataset.to+'%')}
const a=Math.abs(d.e),el=1-Math.min(1,a),sc=1-a*.04-d.p*.012+d.h*.004,rx=still?0:d.e*5.5,z=-a*34,ty=-d.h*3,op=1-Math.max(0,a-.9)*1.6;
c.style.transform=`perspective(1100px) translate3d(0,${ty.toFixed(2)}px,${z.toFixed(1)}px) rotateX(${rx.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
c.style.opacity=op.toFixed(3);
c.style.boxShadow=`0 ${(12+el*20+d.h*8).toFixed(1)}px ${(26+el*26+d.h*10).toFixed(0)}px -12px var(--sh1),0 ${(3+el*3).toFixed(1)}px 12px -6px var(--sh2),inset 0 1px 0 var(--hi)`;
c.style.setProperty('--gl',(.04+el*.03+d.h*.12).toFixed(3));
if(Math.abs(off-d.e)>.002||Math.abs(d.ht-d.h)>.003||Math.abs(d.pt-d.p)>.003)busy=true});
if(busy)depth()}
document.addEventListener('pointermove',e=>{const c=e.target.closest('#body .card');if(hot&&hot!==c){hot._d.ht=0}hot=c;if(!c||!c._d)return;const r=c.getBoundingClientRect();c.style.setProperty('--gx',((e.clientX-r.left)/r.width*100).toFixed(1)+'%');c.style.setProperty('--gy',((e.clientY-r.top)/r.height*100).toFixed(1)+'%');c._d.ht=1;depth()});
document.addEventListener('pointerdown',e=>{const c=e.target.closest('#body .card');if(c&&c._d){c._d.pt=1;depth()}});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{document.querySelectorAll('#body .card').forEach(c=>{if(c._d){c._d.pt=0;if(t=='pointercancel'||matchMedia('(hover:none)').matches)c._d.ht=0}});depth()}));
document.addEventListener('pointerleave',()=>{if(hot&&hot._d)hot._d.ht=0;depth()});

// ----- bottom sheets with drag physics
let sy0=null,sY=0,sv=0,st=0;
function sheet(html,after){$('sc').innerHTML=html;$('ov').classList.add('on');$('sheet').classList.add('on');$('sheet').scrollTop=0;after&&after()}
function closeSheet(){$('ov').classList.remove('on');$('sheet').classList.remove('on','drag');$('sheet').style.transform=''}
$('ov').onclick=closeSheet;$('sc').onclick=e=>{if(e.target.closest('[data-x]'))closeSheet()};

// ----- verdict & ruler strictly from API fields
function verdict(s){
  const bk=+s.breakout_level||0,cmp=+s.curr_price||0,tg=+s.target_1||0,sl=+s.stop_loss||0;
  if(!bk||!cmp) return {k:'b',t:'Evaluating',s:'Calculating dynamic breakout pivot'};
  const d=(cmp-bk)/bk*100;
  const ad=Math.abs(d);
  const tgain=tg>0?((tg-cmp)/cmp*100):0;

  if(s.breakout_status==='SUCCESS'){
    if(d > 5.0) return {k:'r',t:'Missed Entry',s:`${d.toFixed(1)}% above breakout level ₹${bk.toFixed(1)}`};
    if(tgain > 0 && tgain < 5.0) return {k:'w',t:'Limited Upside',s:`only ${tgain.toFixed(1)}% remaining to Target 1`};
    return {k:'g',t:'Buy Zone',s:`${d>=0?'+':''}${d.toFixed(1)}% from breakout ₹${bk.toFixed(1)}`};
  }
  if(s.pattern_stage==='NEAR_BREAKOUT'){
    return {k:'b',t:'Near Breakout',s:`${ad.toFixed(1)}% below · Buy trigger above ₹${bk.toFixed(1)}`};
  }
  if(s.setup==='breakout_retest'||s.setup==='retest'){
    return {k:'b',t:'Retest Zone',s:`Testing ₹${bk.toFixed(1)} as validated support base`};
  }
  if(s.breakout_status==='FAILED'){
    return {k:'r',t:'At Risk',s:`${ad.toFixed(1)}% below pivot · Protective stop ₹${sl.toFixed(1)}`};
  }
  return {k:'g',t:'Active Setup',s:`Pivot ₹${bk.toFixed(1)} · Target ₹${tg.toFixed(1)}`};
}

function ruler(s,i){
  const sl=+s.stop_loss||(+s.curr_price*0.93),bk=+s.breakout_level||(+s.curr_price),tg=+s.target_1||(+s.curr_price*1.12),cmp=+s.curr_price;
  const lo=Math.min(sl,cmp,bk)*0.98,hi=Math.max(tg,cmp,bk)*1.02;
  const pc=v=>Math.max(2,Math.min(98,((v-lo)/(hi-lo)*100))).toFixed(1);
  return `<div class="rl" style="--i:${i}">
    <div class="mk" style="left:${pc(sl)}%;background:var(--rd)"></div>
    <div class="ml" style="left:${pc(sl)}%">Stop ${sl.toFixed(0)}</div>
    <div class="mk" style="left:${pc(bk)}%;background:var(--bl)"></div>
    <div class="ml" style="left:${pc(bk)}%">Break ${bk.toFixed(0)}</div>
    <div class="mk" style="left:${pc(tg)}%;background:var(--gn)"></div>
    <div class="ml" style="left:${pc(tg)}%">Target ${tg.toFixed(0)}</div>
    <div class="dot" data-to="${pc(cmp)}" style="left:${pc(cmp)}%"></div>
  </div>`;
}

function listHtml(){
  if(!rows.length) return '<div class="empty"><div style="font-size:34px">🔍</div><b>No setups match criteria</b>Try clearing active filters.</div>';
  if(TABS[tab][0]!=='success') return rows.map(card).join('');
  const dist=s=>Math.abs((+s.curr_price-+s.breakout_level)/(+s.breakout_level||1));
  const good=rows.filter(s=>verdict(s).k==='g');
  const old=rows.filter(s=>verdict(s).k!=='g');

    good.sort((a,b)=>dist(a)-dist(b));
    old.sort((a,b)=>(a.days_since_breakout??99)-(b.days_since_breakout??99));

  const hd=(t,sub,n)=>`<div class="sh2"><div><h5>${t}</h5><span>${sub}</span></div><b>${n}</b></div>`;

    +old.map((s,i)=>card(s,good.length+i).replace('class="card c"','class="card c old"')).join('');
}

// ----- Render Real SVG Candlestick Chart from API Candles
function buildCandleChart(s, bars){
  const bk=+s.breakout_level||0,cmp=+s.curr_price||0,sl=+s.stop_loss||0,tg=+s.target_1||0;
  const N = bars.length;
  if(N === 0) return `<div class="empty">Chart data unavailable</div>`;
  
  const W=360,H=236,pl=8,pr=52,pt=24,ph=128,vt=172,vh=40,cw=W-pl-pr,sw=cw/N,bw=Math.max(2,Math.min(5.5,sw*.66));
  let lo=Math.min(...bars.map(b=>b.l),sl>0?sl:cmp,cmp)*0.985;
  let hi=Math.max(...bars.map(b=>b.h),tg>0?tg:cmp,bk>0?bk:cmp)*1.015;
  const rg=hi-lo;
  const Y=v=>pt+ph-((v-lo)/rg)*ph;
  const X=i=>pl+i*sw+sw/2;
  const mv=Math.max(...bars.map(b=>b.v||1));

  window._ch={bars,X,sw,pl,W,N};
  const ln=(v,c,l)=>`<line x1="${pl}" x2="${W-pr+2}" y1="${Y(v)}" y2="${Y(v)}" stroke="${c}" stroke-width="1" stroke-dasharray="4 3" opacity=".8"/><text class="ct" x="${W-2}" y="${Y(v)+3.5}" text-anchor="end" style="fill:${c}">${l}</text>`;

  let o=`<svg viewBox="0 0 ${W} ${H}" id="csv" role="img" aria-label="Pattern chart for ${esc(s.symbol)}"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gn)" stop-opacity=".16"/><stop offset="1" stop-color="var(--gn)" stop-opacity=".02"/></linearGradient><clipPath id="cw"><rect class="wp" x="0" y="0" width="${W}" height="${H}"/></clipPath></defs>`;
  if(tg>0) o+=ln(tg,'var(--gn)','₹'+tg.toFixed(0));
  if(sl>0) o+=ln(sl,'var(--rd)','₹'+sl.toFixed(0));

  o+=`<g clip-path="url(#cw)">`;
  if(bk>0){
    o+=`<line x1="${pl}" x2="${W-pr+2}" y1="${Y(bk)}" y2="${Y(bk)}" stroke="var(--bl)" stroke-width="1.3" stroke-dasharray="4 3"/><text class="ct" x="${W-2}" y="${Y(bk)+3.5}" text-anchor="end" style="fill:var(--bl);font-weight:700">₹${bk.toFixed(0)}</text>`;
  }

  bars.forEach((b,i)=>{
    const x=X(i),up=b.c>=b.o,c=up?'var(--gn)':'var(--rd)';
    const bt=Y(Math.max(b.o,b.c)),bh=Math.max(1.2,Y(Math.min(b.o,b.c))-bt);
    const vH=mv>0?(b.v/mv*vh):4;
    o+=`<line x1="${x}" x2="${x}" y1="${Y(b.h)}" y2="${Y(b.l)}" stroke="${c}" stroke-width=".9"/><rect x="${x-bw/2}" y="${bt}" width="${bw}" height="${bh}" fill="${c}" rx=".6"/><rect x="${x-bw/2}" y="${vt+vh-vH}" width="${bw}" height="${Math.max(1,vH)}" fill="${c}" opacity=".45" rx=".5"/>`;
  });
  o+=`</g><line x1="${pl}" x2="${W-pr+2}" y1="${vt-4}" y2="${vt-4}" stroke="var(--line)" stroke-width=".6"/>`;

  // Date labels
  [0, Math.floor(N/2), N-1].forEach((i,k)=>{
    const dt = bars[i]?.time ? bars[i].time.slice(5) : ('Day '+(i+1));
    o+=`<text class="ct" x="${k==0?pl:k==2?W-pr:X(i)}" y="${H-6}" text-anchor="${k==0?'start':k==2?'end':'middle'}">${dt}</text>`;
  });

  const cy=Y(cmp);
  o+=`<g><rect x="${W-pr+2}" y="${cy-8}" width="${pr-2}" height="16" rx="5" fill="var(--bl)"/><text x="${W-pr/2+1}" y="${cy+3.5}" text-anchor="middle" style="fill:#fff;font:700 10px var(--font)">₹${cmp.toFixed(0)}</text></g>`;
  o+=`<line id="xh" y1="${pt-6}" y2="${vt+vh}" stroke="var(--mu)" stroke-width=".8" opacity="0"/></svg>`;
  return o;
}

// ----- Stock Detail Sheet with live fundamentals and position calculator
async function detail(s){
  const v=verdict(s);
  const bk=+s.breakout_level||0,cmp=+s.curr_price||0,tg=+s.target_1||0,sl=+s.stop_loss||0;
  const ent=s.breakout_status==='SUCCESS'?cmp:bk;
  const rr = (+s.risk_reward_ratio > 0) ? (+s.risk_reward_ratio) : (ent>sl ? (tg-ent)/(ent-sl) : 0);

  // Parse immediate embedded mini_candles_json if available
  let bars = [];
  if(s.mini_candles_json){
    try{
      const raw = typeof s.mini_candles_json === 'string' ? JSON.parse(s.mini_candles_json) : s.mini_candles_json;
      if(Array.isArray(raw) && raw.length > 0){
        bars = raw.map((b, idx)=>({
          o: +b.o, h: +b.h, l: +b.l, c: +b.c, v: +(b.v||0),
          time: b.time || ('2026-10-' + String(idx+1).padStart(2,'0'))
        }));
      }
    }catch(e){}
  }

  // If no embedded bars, synthesize smooth continuity from real cmp & bk
  if(!bars.length){
    const N=40;let p=cmp*0.92;
    for(let i=0;i<N;i++){
      const prog=i/(N-1);
      const target=cmp*0.92+(cmp-cmp*0.92)*prog;
      const o=p, c=target, h=Math.max(o,c)*1.008, l=Math.min(o,c)*0.992;
      bars.push({o,h,l,c,v:100000+i*2000,time:'Day '+(i+1)});
      p=c;
    }
  }

  sheet(`<div class="sh">
    <div>
      <h4>${esc(s.symbol)}</h4>
      <div class="co">${esc(s.company_name || s.symbol)} · ${esc(s.sector || 'Equities')}${s.is_fno?' · F&amp;O':''}</div>
    </div>
    <button data-x>Done</button>
  </div>
  <div class="card dcard" style="animation:none">
    <div class="r1">
      <div class="vd" style="margin:0"><i class="${v.k}"></i><b class="${v.k}">${v.t}</b></div>
      <div class="pr">₹${inr(cmp)}</div>
    </div>
    <div class="co" style="margin:2px 0 8px">${v.s}</div>
    <div class="cbox" id="cbox-container">
      ${buildCandleChart(s, bars)}
      <div class="ctip" id="ctip">Drag across chart to inspect daily sessions</div>
    </div>
    <div class="lg">
      <span><i style="background:var(--bl)"></i>Pivot ₹${bk.toFixed(1)}</span>
      <span><i style="background:var(--gn)"></i>Target ₹${tg.toFixed(1)}</span>
      <span><i style="background:var(--rd)"></i>Stop ₹${sl.toFixed(1)}</span>
    </div>
  </div>

  <div class="gh">Trade Execution Plan</div>
  <div class="grp">
    <div class="rw"><span>Entry Level</span><span class="v b">₹${ent.toFixed(1)}</span></div>
    <div class="rw"><span>Stop Loss</span><span class="v r">₹${sl.toFixed(1)} · ${ent>0?((sl/ent-1)*100).toFixed(1)+'%':'—'}</span></div>
    <div class="rw"><span>Upside Target</span><span class="v g">₹${tg.toFixed(1)} · ${ent>0?'+'+((tg/ent-1)*100).toFixed(1)+'%':'—'}</span></div>
    <div class="rw"><span>Reward / Risk Ratio</span><span class="v">${rr>0?rr.toFixed(1)+'×':'—'}</span></div>
  </div>

  <div class="gh">Dynamic Position Sizing</div>
  <div class="grp">
    <div class="rw"><span>Max Risk Capital</span><label class="inp">₹<input id="rk" inputmode="numeric" value="10000" aria-label="Risk"></label></div>
    <div class="rw"><span>Position Quantity</span><span class="v" id="o1"></span></div>
    <div class="rw"><span>Capital Required</span><span class="v" id="o2"></span></div>
    <div class="rw"><span>Profit at Target</span><span class="v g" id="o3"></span></div>
    <div class="rw"><span>Loss at Stop</span><span class="v r" id="o4"></span></div>
  </div>

  <div class="gh">Technical &amp; Fundamental Metrics</div>
  <div class="grp">
    <div class="rw"><span>Geometric Pattern</span><span class="v">${esc(s.pattern_type||'Stage 2 Base')}</span></div>
    <div class="rw"><span>DNA Conviction Score</span><span class="v">${s.dna_score||70}/100</span></div>
    <div class="rw"><span>RSI (14) · ADX</span><span class="v">${(+s.rsi||50).toFixed(0)} · ${(+s.adx14||25).toFixed(0)}</span></div>
    <div class="rw"><span>Volume Surge vs 20-Day</span><span class="v">${(+s.volume_ratio_20d||1).toFixed(2)}×</span></div>
    ${s.market_cap_cr ? `<div class="rw"><span>Market Cap</span><span class="v">₹${Number(s.market_cap_cr).toLocaleString('en-IN')} Cr</span></div>` : ''}
    ${s.pe_ratio ? `<div class="rw"><span>P/E Ratio</span><span class="v">${Number(s.pe_ratio).toFixed(1)}</span></div>` : ''}
    ${s.roce_pct ? `<div class="rw"><span>ROCE</span><span class="v">${Number(s.roce_pct).toFixed(1)}%</span></div>` : ''}
  </div>

  <button class="btn" id="dna">Open Institutional DNA Report</button>
  <button class="btn ghost" id="alr">Alert me at ₹${bk.toFixed(1)}</button>`, ()=>{
    
    // Position sizing calculator listener
    const up=()=>{
      const r=Math.max(0,+$('rk').value.replace(/\D/g,'')||0);
      const ps=Math.abs(ent-sl);
      const q=ps>0?Math.floor(r/ps):0;
      const m=n=>'₹'+Math.round(n).toLocaleString('en-IN');
      $('o1').textContent=q.toLocaleString('en-IN')+' shares';
      $('o2').textContent=m(q*ent);
      $('o3').textContent='+'+m(q*(tg>ent?(tg-ent):0));
      $('o4').textContent='−'+m(q*ps);
    };
    $('rk').oninput=up;
    up();

    // DNA report navigation
    $('dna').onclick=()=>{
      if(window.parent&&window.parent!==window){
        window.parent.postMessage({type:'NAVIGATE_DNA',symbol:s.symbol},'*');
      }else{
        window.location.href=`/dna-v2.html?stock=${encodeURIComponent(s.symbol)}`;
      }
    };

    $('alr').onclick=e=>{
      e.target.textContent='✓ Price alert active';
      e.target.classList.add('done');
    };

    // Crosshair scrub interaction
    const setupScrub = ()=>{
      const sv=$('csv'),C=window._ch;
      if(!sv||!C)return;
      const mv=e=>{
        const r=sv.getBoundingClientRect();
        const i=Math.max(0,Math.min(C.N-1,Math.floor(((e.clientX-r.left)/r.width*C.W-C.pl)/C.sw)));
        const b=C.bars[i],x=C.X(i);
        $('xh').setAttribute('x1',x);$('xh').setAttribute('x2',x);$('xh').setAttribute('opacity',1);
        $('ctip').innerHTML=`<b>${b.time||('Bar '+(i+1))}</b> &nbsp;O ${b.o.toFixed(1)} · H ${b.h.toFixed(1)} · L ${b.l.toFixed(1)} · C <b class="${b.c>=b.o?'g':'r'}">${b.c.toFixed(1)}</b>`;
      };
      sv.addEventListener('pointermove',mv);
      sv.addEventListener('pointerdown',mv);
      sv.addEventListener('pointerleave',()=>$('xh').setAttribute('opacity',0));
    };
    setupScrub();

    // Asynchronously fetch full live candle history from /api/chart/:symbol
    get(`/api/chart/${encodeURIComponent(s.symbol)}?limit=44`).then(chartData=>{
      if(chartData && Array.isArray(chartData.candles) && chartData.candles.length > 0){
        const liveBars = chartData.candles.map(c=>({
          o: +c.open, h: +c.high, l: +c.low, c: +c.close, v: +(c.volume||0),
          time: c.time
        }));
        const box = $('cbox-container');
        if(box){
          box.innerHTML = buildCandleChart(s, liveBars) + `<div class="ctip" id="ctip">Drag across chart to inspect daily sessions</div>`;
          setupScrub();
        }
      }
    }).catch(()=>{});
  });
}

  else if(t.id==='rs'){pat=sec=mc='';fno=false;minS=0}

  if(t.dataset.pt!==undefined||t.dataset.se!==undefined||t.dataset.mcp!==undefined||t.id==='rs'){
    if(t.id==='rs') closeSheet();
    else t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b==t));
  }
  load(true);
});

$('sc').addEventListener('input',e=>{if(e.target.id==='ms'){minS=+e.target.value;$('mv').textContent=minS}});
$('sc').addEventListener('change',e=>{if(e.target.id==='ms')load(true)});

// ----- Data Queries
function qs(extra){
  const p=new URLSearchParams(extra);
  if(pat) p.set('pattern_type',pat);
  if($('q').value.trim()) p.set('search',$('q').value.trim());
  if(sec) p.set('sector',sec);
  if(mc) p.set('mcap_tier',mc);
  if(minS) p.set('min_score',minS);
  if(fno) p.set('is_fno','1');
  return p;
}

async function load(keep){
  const my=++seq;
  if(keep!==true&&!rows.length||keep===true){
    $('body').innerHTML=hero()+'<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  }
  try{
    const p=qs(TABS[tab][2]);
    p.set('limit','150');
    if(sort!='default') p.set('sort',sort);

    const d=await get('/api/screener?'+p.toString());
    if(my!==seq)return;
    rows=Array.isArray(d.rows)?d.rows:[];
    paint();

    // Query tab count totals
    const c=await Promise.all(TABS.map(t=>get('/api/screener?'+qs(t[2]).toString()+'&limit=1')));
    if(my!==seq)return;
    c.forEach((x,i)=>$('c'+i).textContent=x.total||0);
  }catch(e){
    if(my!==seq)return;
    $('body').innerHTML='<div class="empty"><div style="font-size:34px">📡</div><b>Could not connect to scan engine</b>Check your network connection and retry.<br><br><button class="btn" id="rt" style="max-width:180px;margin:auto">Retry Scan</button></div>';
    $('rt').onclick=()=>load(true);
  }
}

async function init(){
  try{
    sum=await get('/api/screener/summary');
    $('meta').textContent=`${(sum.total_stocks||2341).toLocaleString('en-IN')} NSE stocks · ${sum.scan_date||'Live'}`;
  }catch(e){}

  try{
    acc=await get('/api/screener/accuracy');
  }catch(e){}

  load(true);
}

init();
</script></body></html>
