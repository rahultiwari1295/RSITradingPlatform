<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuantSync</title>
<meta name="description" content="AI trade calls, pattern breakouts with measured odds, and a plain-English X-Ray of every NSE stock.">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070B13" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232346E8'/%3E%3Cpath d='M7 21.5 12.5 15l4 3.5L25 9.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='9.5' r='2.6' fill='%23F2B02E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/m/m.css?v=5">
</head>
<body>
<div id="app">
  <nav id="rail" aria-label="Main"></nav>
  <main id="stage"></main>
</div>
<nav id="tabs" aria-label="Main"></nav>
<noscript><p style="padding:24px">QuantSync needs JavaScript to load live market data.</p></noscript>
<script>
  /* never leave the phone on a blank screen: show what went wrong */
  (function () {
    function fail(msg) {
      var st = document.getElementById('stage');
      if (!st || st.children.length) return;
      st.innerHTML = '<div style="padding:90px 24px;font:15px/1.5 system-ui,sans-serif;color:#8a94a6"><b style="color:#d9534f">This page could not start.</b><br>' + String(msg).replace(/</g, '&lt;') + '<br><br><a href="/m/?r=' + Date.now() + '" style="color:#2346E8;font-weight:600">Reload</a></div>';
    }
    window.addEventListener('error', function (e) { fail(e.message || 'Script error'); });
    window.addEventListener('unhandledrejection', function (e) { fail((e.reason && e.reason.message) || e.reason); });
    setTimeout(function () { fail('It is taking too long. Check your connection and reload.'); }, 9000);
  })();
</script>
<script type="module">
  import { boot } from '/m/core.js';
  boot();
</script>
</body>
</html>
