<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>QuantSync Institutional Screener · Pattern & Breakout Radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #080B11;
      --bg-card: #0F141C;
      --bg-card-hover: #151C28;
      --bg-surface: #1E2638;
      --border-card: rgba(255, 255, 255, 0.08);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --accent: #3B82F6;
      --profit: #10B981;
      --loss: #EF4444;
      --warning: #F59E0B;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    [data-theme="light"] {
      --bg-base: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-card-hover: #F1F5F9;
      --bg-surface: #E2E8F0;
      --border-card: #E2E8F0;
      --border-subtle: #F1F5F9;
      --text-main: #0F172A;
      --text-muted: #475569;
      --text-dim: #64748B;
      --accent: #2563EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-base);
      color: var(--text-main);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      padding: 10px 8px 30px;
      min-height: 100vh;
    }
    .container {
      max-width: 100%;
      width: 100%;
      margin: 0;
      padding: 0 4px;
    }
    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }
    .badge-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--accent);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }
    .accuracy-box {
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.28);
      text-align: right;
    }
    .accuracy-val {
      font-size: 20px;
      font-weight: 800;
      color: var(--profit);
      font-family: var(--font-mono);
    }
    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      text-align: center;
    }
    .kpi-num {
      font-size: 16px;
      font-weight: 800;
      margin-top: 2px;
    }
    .tabs-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .tab-btn {
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid var(--border-card);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: rgba(59, 130, 246, 0.18);
      border-color: var(--accent);
      color: var(--text-main);
    }
    .filter-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-card);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      font-family: inherit;
    }
    .filters-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .select-ctl {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 600;
      font-family: inherit;
    }
    .chip-ctl {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip-ctl.on {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
    }
    .stocks-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stock-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .stock-card:hover {
      transform: translateX(3px);
      border-color: var(--accent);
    }
    .stock-card.near { border-left: 3px solid var(--warning); }
    .stock-card.success { border-left: 3px solid var(--profit); }
    .stock-card.failed { border-left: 3px solid var(--loss); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .sym {
      font-size: 15px;
      font-weight: 800;
      font-family: var(--font-mono);
    }
    .badge-pill {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--bg-surface);
      color: var(--text-muted);
      font-weight: 700;
      margin-left: 6px;
    }
    .pattern-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--bg-surface);
      font-size: 11.5px;
    }
    .metrics-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 10px;
      font-size: 10.5px;
    }
    .metric-label { color: var(--text-dim); }
    .metric-val { font-family: var(--font-mono); font-weight: 700; color: var(--text-main); }

      /* KPI row */
      .kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--border-subtle); text-align:center; width:100%; }
      .kpi-lbl { font-size:9.5px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
      .kpi-num { font-size:16px; font-weight:800; margin-top:2px; font-family:var(--font-mono); }
      /* Breakout card extras */
      .bk-lvls { display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px; margin-top:10px; }
      .bk-lbox { background:var(--bg-surface); border-radius:8px; padding:6px 8px; text-align:center; }
      .bk-llbl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:2px; }
      .bk-lval { font-size:13px; font-weight:800; font-family:var(--font-mono); }
      .bk-lval.entry { color:#06B6D4; }
      .bk-lval.stop  { color:var(--loss); }
      .bk-lval.tgt   { color:var(--profit); }
      .bk-bar-wrap { margin-top:8px; }
      .bk-bar-row  { display:flex; justify-content:space-between; align-items:center; margin-bottom:3px; }
      .bk-bar-row span { font-size:10px; color:var(--text-dim); }
      .bk-bar-bg   { height:4px; background:var(--bg-surface); border-radius:3px; overflow:hidden; }
      .bk-bar-fill { height:100%; border-radius:3px; }
      .rr-badge    { font-size:10.5px; font-weight:800; font-family:var(--font-mono); padding:1px 7px; border-radius:5px; border:1px solid; }
      .rr-good { background:rgba(16,185,129,.12); border-color:rgba(16,185,129,.25); color:var(--profit); }
      .rr-ok   { background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.25); color:var(--warning); }
      .rr-poor { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.25); color:var(--loss); }
      .pattern-pills-wrap {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 4px;
        scrollbar-width: none;
      }
      .pattern-pills-wrap::-webkit-scrollbar { display: none; }
      .pattern-pill {
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid var(--border-card);
        background: var(--bg-surface);
        color: var(--text-muted);
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        transition: all 0.15s ease;
      }
      .pattern-pill.active {
        border-color: var(--accent);
        background: rgba(59, 130, 246, 0.18);
        color: var(--text-main);
        font-weight: 800;
      }
      .radar-entry-badge {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 8px;
        margin-top: 8px;
        font-size: 11px;
        font-weight: 800;
      }
      .radar-entry-badge.success {
        background: rgba(16, 185, 129, 0.12);
        border: 1px solid rgba(16, 185, 129, 0.25);
        color: var(--profit);
      }
      .radar-entry-badge.near {
        background: rgba(245, 158, 11, 0.12);
        border: 1px solid rgba(245, 158, 11, 0.25);
        color: var(--warning);
      }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header-card">
      <div>
        <div class="badge-chip">⚡ QuantSync Institutional Screener</div>
        <div class="title">Pattern & Breakout Radar</div>
        <div class="subtitle" id="scanMeta">Scanned across 1,318 NSE universe equities</div>
      </div>
      <div class="accuracy-box" id="accuracyBox" style="display:none;">
        <div style="font-size: 9.5px; font-weight: 700; color: var(--profit); text-transform: uppercase;">90D Win Rate</div>
        <div class="accuracy-val" id="accuracyVal">0%</div>
        <div style="font-size: 9.5px; color: var(--text-dim);" id="accuracyMeta">Verified signals</div>
      </div>
    </div>

    <!-- Primary Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" onclick="setTab('near_breakout', this)">🎯 Near Breakout <span id="countNear"></span></button>
      <button class="tab-btn" onclick="setTab('success', this)">🚀 Breakout Confirmed <span id="countSuccess"></span></button>
      <button class="tab-btn" onclick="setTab('failed', this)">⚠️ Failed Breakout <span id="countFailed"></span></button>
    </div>

    <!-- Pattern Explorer & Search Bar -->
    <div class="filter-card">
      <input type="text" class="search-input" id="searchInput" placeholder="Search stock ticker or company name..." oninput="handleSearch(this.value)">
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.04em;">Explore Chart Patterns & Bases</span>
          <span id="clearPatternBtn" style="font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;display:none;" onclick="selectPattern('ALL')">Clear Pattern Filter</span>
        </div>
        <div class="pattern-pills-wrap">
          <button class="pattern-pill active" onclick="selectPattern('ALL', this)"><span>✨</span> All Setups</button>
          <button class="pattern-pill" onclick="selectPattern('Breakout Rally', this)"><span>🚀</span> Breakout Rally</button>
          <button class="pattern-pill" onclick="selectPattern('Double Bottom', this)"><span>🇼</span> Double Bottom (W)</button>
          <button class="pattern-pill" onclick="selectPattern('Horizontal Range', this)"><span>📏</span> Horizontal Base</button>
          <button class="pattern-pill" onclick="selectPattern('Orderly Pullback', this)"><span>📉</span> 50-EMA Dip</button>
          <button class="pattern-pill" onclick="selectPattern('Volatility Contraction', this)"><span>🌪️</span> VCP Squeeze</button>
          <button class="pattern-pill" onclick="selectPattern('Triangle', this)"><span>📐</span> Triangle / Wedge</button>
        </div>
      </div>
    </div>

    <!-- Stock Cards -->
    <div class="stocks-list" id="stocksList">
      <div style="text-align: center; padding: 40px; color: var(--text-dim);">Loading screener intelligence...</div>
    </div>
  </div>

  <script>
    let currentTab = 'near_breakout';
    let selectedPattern = 'ALL';
    let searchVal = '';

    function init() {
      const urlParams = new URLSearchParams(window.location.search);
      const th = urlParams.get('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', th);

      const tabParam = urlParams.get('tab');
      if (tabParam) {
        currentTab = tabParam;
        document.querySelectorAll('.tab-btn').forEach(b => {
          const oc = b.getAttribute('onclick') || '';
          if (oc.includes(tabParam)) {
            b.classList.add('active');
          } else {
            b.classList.remove('active');
          }
        });
      }

      const searchParam = urlParams.get('search') || urlParams.get('symbol');
      if (searchParam) {
        searchVal = searchParam.trim();
        const searchInput = document.getElementById('searchInput');
        if (searchInput) searchInput.value = searchVal;
      }

      loadSummary();
      loadAccuracy();
      loadBreakoutCounts();
      applyFilters();
    }

    async function loadSummary() {
      try {
        const res = await fetch('/api/screener/summary');
        const d = await res.json();
        if (d && d.scan_date) {
          const n = (d.total_stocks||0).toLocaleString();
          document.getElementById('scanMeta').textContent =
            'Scanned across ' + n + ' NSE universe equities \u00b7 Updated ' + d.scan_date;
          document.getElementById('kpiUniverse').textContent = n;
          const bullish = (d.stances||{}).BULLISH || 0;
          document.getElementById('kpiBullish').textContent = bullish.toLocaleString();
          const failed = (d.breakout_statuses||{}).FAILED || 0;
          if (document.getElementById('countFailed')) document.getElementById('countFailed').textContent = failed;
        }
      } catch (e) {}
    }

    async function loadAccuracy() {
      try {
        const res = await fetch('/api/screener/accuracy?days=90');
        const d = await res.json();
        if (d && d.win_rate_pct > 0) {
          document.getElementById('accuracyBox').style.display = 'block';
          document.getElementById('accuracyVal').textContent = d.win_rate_pct + '%';
          document.getElementById('accuracyMeta').textContent =
            d.winners + ' of ' + d.total_resolved_signals + ' signals verified';
        }
      } catch (e) {}
    }

    async function loadBreakoutCounts() {
      try {
        const res = await fetch('/api/screener/breakouts');
        const d = await res.json();
        if (d) {
          const nearLen = (d.near_breakout || []).length;
          const successLen = (d.success || []).length;
          document.getElementById('countNear').textContent = nearLen;
          document.getElementById('countSuccess').textContent = successLen;
          document.getElementById('kpiNear').textContent = nearLen;
          document.getElementById('kpiSuccess').textContent = successLen;
        }
      } catch (e) {}
    }

    function setTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    }

    function selectPattern(pat, btn) {
      selectedPattern = pat;
      document.querySelectorAll('.pattern-pill').forEach(b => b.classList.remove('active'));
      if (btn) {
        btn.classList.add('active');
      } else {
        const pills = document.querySelectorAll('.pattern-pill');
        pills.forEach(p => {
          if (p.textContent.includes('All Setups') && pat === 'ALL') p.classList.add('active');
        });
      }
      const clearBtn = document.getElementById('clearPatternBtn');
      if (clearBtn) clearBtn.style.display = (pat === 'ALL') ? 'none' : 'inline';
      applyFilters();
    }

    function handleSearch(v) {
      searchVal = v.trim();
      applyFilters();
    }

    async function applyFilters() {
      const listEl = document.getElementById('stocksList');
      listEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)">Filtering Institutional Screener Universe\u2026</div>';
      const params = new URLSearchParams();
      params.set('limit', '100');
      if (currentTab === 'near_breakout') params.set('pattern_stage', 'NEAR_BREAKOUT');
      if (currentTab === 'success') params.set('breakout_status', 'SUCCESS');
      if (currentTab === 'failed') params.set('breakout_status', 'FAILED');
      if (selectedPattern !== 'ALL') params.set('pattern_type', selectedPattern);
      if (searchVal) params.set('search', searchVal);

      try {
        const res = await fetch('/api/screener?' + params.toString());
        const d = await res.json();
        let rows = d.rows || [];

        // Secondary strict client filter
        if (currentTab === 'success') {
          rows = rows.filter(s => {
            return s.breakout_level && Number(s.breakout_level) > 0;
          });
          rows.sort((a, b) => {
            const cmpA = Number(a.curr_price || 0), brkA = Number(a.breakout_level || 1);
            const cmpB = Number(b.curr_price || 0), brkB = Number(b.breakout_level || 1);
            const diffPctA = (cmpA - brkA) / brkA * 100;
            const diffPctB = (cmpB - brkB) / brkB * 100;
            const isMissedA = Math.abs(diffPctA) > 5.0;
            const isMissedB = Math.abs(diffPctB) > 5.0;

            // 1. Good To Buy first (<= 5%), then Missed (> 5%)
            if (isMissedA !== isMissedB) {
              return isMissedA ? 1 : -1;
            }
            // 2. From less percent to more percent
            return diffPctA - diffPctB;
          });
        } else if (currentTab === 'near_breakout') {
          rows = rows.filter(s => {
            const hasPivot = s.breakout_level && Number(s.breakout_level) > 0;
            if (!hasPivot) return false;
            const distPct = (Number(s.breakout_level) - Number(s.curr_price)) / Number(s.breakout_level) * 100;
            return Number(s.curr_price) < Number(s.breakout_level) && distPct <= 5.0 && distPct >= 0;
          });
          rows.sort((a, b) => {
            const distA = (Number(a.breakout_level) - Number(a.curr_price)) / Number(a.breakout_level);
            const distB = (Number(b.breakout_level) - Number(b.curr_price)) / Number(b.breakout_level);
            return distA - distB;
          });
        }

        renderStocks(rows);
        if (currentTab === 'all') document.getElementById('countAll').textContent = d.total || rows.length;
      } catch (e) {
        listEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--loss)">Failed to load.</div>';
      }
    }

    function fp(n) {
      if (n == null || n === '') return '\u2014';
      return Number(n).toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2});
    }

    function renderStocks(rows) {
      const listEl = document.getElementById('stocksList');
      if (!rows.length) {
        listEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim)"><div style="font-size:28px;margin-bottom:8px;">🔍</div><b>No Actionable Setups Found</b><div style="font-size:12px;margin-top:4px;">Try selecting "All Setups" or clearing filters.</div></div>';
        return;
      }
      listEl.innerHTML = rows.map(function(s) {
        var hasPivot = s.breakout_level && Number(s.breakout_level) > 0;
        var cmp = Number(s.curr_price || 0);
        var brk = Number(s.breakout_level || 0);
        var tgt = Number(s.target_1 || 0);
        var diffPct = hasPivot ? ((cmp - brk) / brk * 100) : 0;
        var diffAbs = Math.abs(diffPct);
        var targetGainPct = (tgt > 0 && cmp > 0) ? ((tgt - cmp) / cmp * 100) : null;

        var isNear = s.pattern_stage === 'NEAR_BREAKOUT' || (hasPivot && cmp < brk && diffAbs <= 5.0);
        var isSuccess = s.breakout_status === 'SUCCESS';
        var isFailed = s.breakout_status === 'FAILED';

        var isMissed = diffAbs > 5.0;
        var isSkip = !isMissed && targetGainPct !== null && targetGainPct < 5.0;
        var isGoodToBuy = !isMissed && !isSkip;

        var cardClass = isSuccess ? (isMissed ? 'failed' : isSkip ? 'near' : 'success') : (isNear ? 'near' : (isFailed ? 'failed' : ''));
        var score = s.dna_score || 50;
        var sc = score>=75?'var(--profit)':score>=50?'var(--warning)':'var(--loss)';
        var sym = s.symbol||'';
        var esc = sym.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
        var cmpFmt = Number(s.curr_price||0).toLocaleString('en-IN',{minimumFractionDigits:2});
        var daysSince = s.days_since_breakout != null ? Number(s.days_since_breakout) : null;
        var daysLabel = daysSince === 0 ? '🔥 Today (Day 0)' : daysSince === 1 ? '⚡ 1d ago' : daysSince != null ? '⚡ ' + daysSince + 'd ago' : '';

        var entryBanner = '';
        if (isSuccess && hasPivot && isGoodToBuy) {
          entryBanner = '<div class="radar-entry-badge success">' +
            '<span>🟢 Good to Buy : ' + (diffPct >= 0 ? '+' : '') + diffPct.toFixed(1) + '% from Breakout (₹' + brk.toFixed(1) + ')</span>' +
            (daysLabel ? '<span style="background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;">' + daysLabel + '</span>' : '') +
            '</div>';
        } else if (isSuccess && hasPivot && isSkip) {
          entryBanner = '<div class="radar-entry-badge near">' +
            '<span>⏭️ SKIPP : ' + (targetGainPct !== null ? targetGainPct.toFixed(1) : '0') + '% left in target</span>' +
            (daysLabel ? '<span style="background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;">' + daysLabel + '</span>' : '') +
            '</div>';
        } else if (isSuccess && hasPivot && isMissed) {
          entryBanner = '<div class="radar-entry-badge" style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.25);color:var(--loss);">' +
            '<span>🛑 MISSED : ' + (diffPct >= 0 ? '+' : '') + diffPct.toFixed(1) + '% from Breakout (₹' + brk.toFixed(1) + ')</span>' +
            (daysLabel ? '<span style="background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;">' + daysLabel + '</span>' : '') +
            '</div>';
        } else if (isNear && hasPivot && !isSuccess) {
          entryBanner = '<div class="radar-entry-badge" style="background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.25);color:var(--accent);">' +
            '<span>🎯 Ready to Buy at ₹' + brk.toFixed(1) + '</span>' +
            '<span style="background:rgba(255,255,255,0.06);color:var(--text-dim);padding:1px 6px;border-radius:4px;">(just ' + diffAbs.toFixed(2) + '% left for confirmation)</span>' +
            '</div>';
        }

        return '<div class="stock-card '+cardClass+'" onclick="openDna(\''+esc+'\')">'+
          '<div class="card-top">'+
          '<div><div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;">'+
          '<span class="sym">'+sym+'</span>'+
          (s.pattern_type ? '<span class="badge-pill" style="color:var(--accent);background:rgba(59,130,246,0.15);border:1px solid rgba(59,130,246,0.3);">📐 ' + s.pattern_type + '</span>' : '') +
          (s.mcap_tier ? '<span class="badge-pill">'+s.mcap_tier+'</span>' : '') +
          '</div><div style="font-size:11px;color:var(--text-dim);margin-top:3px">'+(s.company_name||s.sector||'\u2014')+'</div></div>'+
          '<div style="text-align:right;">'+
          '<div style="font-size:15px;font-weight:800;font-family:var(--font-mono);">\u20b9'+cmpFmt+'</div>'+
          '<div style="font-size:10px;font-weight:700;color:'+sc+';margin-top:2px;">DNA Score: '+score+'/100</div>'+
          '</div></div>'+
          entryBanner +
          '<div class="metrics-row">'+
          '<div><span class="metric-label">Breakout: </span><span class="metric-val">'+(s.breakout_level?'\u20b9'+Number(s.breakout_level).toFixed(1):'\u2014')+'</span></div>'+
          '<div><span class="metric-label">RSI (14): </span><span class="metric-val">'+(s.rsi!=null?Number(s.rsi).toFixed(1):'\u2014')+'</span></div>'+
          '<div><span class="metric-label">ROCE: </span><span class="metric-val">'+(s.roce_pct!=null?Number(s.roce_pct).toFixed(1)+'%':'\u2014')+'</span></div>'+
          '<div><span class="metric-label">P/E: </span><span class="metric-val">'+(s.pe_ratio!=null?Number(s.pe_ratio).toFixed(1):'\u2014')+'</span></div>'+
          '</div></div>';
      }).join('');
    }

    function openDna(sym) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'SELECT_STOCK', symbol: sym }, '*');
      }
      window.location.href = '/stock-detail.html?symbol=' + encodeURIComponent(sym);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
