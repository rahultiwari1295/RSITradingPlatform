<title>QuantSync Product Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* QuantSync, calm luxe. Neutral surfaces, one accent per product, colour only where it means something.
   Depth comes from springs (page, tab, sheet, list), material bars and soft shadows. Text never tilts. */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
  --bg:#0A0A0C;--card:#141417;--card2:#1C1C21;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --fg:#F5F5F7;--mu:rgba(245,245,247,.68);--dim:rgba(245,245,247,.5);
  --up:#3DDC84;--dn:#FF5A5F;--ax:#A497FF;--ai:#3DDC97;--pt:#F7B955;--pf:#6CCBFF;--warn:#F7B955;
  --p1:#A497FF;--p2:#6CCBFF;--p3:#F7B955;--p4:#FF7EB6;--p5:#3DDC97;--p6:#C9C9D1;
  --mat:rgba(18,18,21,.74);--track:rgba(255,255,255,.08);--shc:0,0,0;--stage:#000;--acc:var(--fg);
  color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F4F4F6;--card:#FFFFFF;--card2:#F0F0F3;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.13);
  --fg:#0B0B0E;--mu:rgba(11,11,14,.68);--dim:rgba(11,11,14,.56);
  --up:#0F8A4C;--dn:#D2283A;--ax:#5A45E0;--ai:#0B8458;--pt:#9A5A00;--pf:#0A6AAE;--warn:#9A5A00;
  --p1:#5A45E0;--p2:#0A6AAE;--p3:#B86E00;--p4:#C2306F;--p5:#0B8458;--p6:#7A7A86;
  --mat:rgba(255,255,255,.8);--track:rgba(0,0,0,.06);--shc:30,30,55;--stage:#DCDCE2;color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F4F4F6;--card:#FFFFFF;--card2:#F0F0F3;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.13);
  --fg:#0B0B0E;--mu:rgba(11,11,14,.68);--dim:rgba(11,11,14,.56);
  --up:#0F8A4C;--dn:#D2283A;--ax:#5A45E0;--ai:#0B8458;--pt:#9A5A00;--pf:#0A6AAE;--warn:#9A5A00;
  --p1:#5A45E0;--p2:#0A6AAE;--p3:#B86E00;--p4:#C2306F;--p5:#0B8458;--p6:#7A7A86;
  --mat:rgba(255,255,255,.8);--track:rgba(0,0,0,.06);--shc:30,30,55;--stage:#DCDCE2;color-scheme:light}
:root[data-theme="dark"]{
  --bg:#0A0A0C;--card:#141417;--card2:#1C1C21;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --fg:#F5F5F7;--mu:rgba(245,245,247,.68);--dim:rgba(245,245,247,.5);
  --up:#3DDC84;--dn:#FF5A5F;--ax:#A497FF;--ai:#3DDC97;--pt:#F7B955;--pf:#6CCBFF;--warn:#F7B955;
  --p1:#A497FF;--p2:#6CCBFF;--p3:#F7B955;--p4:#FF7EB6;--p5:#3DDC97;--p6:#C9C9D1;
  --mat:rgba(18,18,21,.74);--track:rgba(255,255,255,.08);--shc:0,0,0;--stage:#000;color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font:400 16px/1.4 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}.dim{color:var(--dim)}
.stage{height:100%;display:flex;align-items:center;justify-content:center}
.device{position:relative;width:100%;height:100%;max-width:430px;overflow:hidden;background:var(--bg);isolation:isolate}
@media (min-width:600px){.stage{padding:18px}.device{height:min(100%,900px);border-radius:48px;box-shadow:0 0 0 1px var(--line2),0 50px 120px rgba(0,0,0,.45)}}
#screens{position:absolute;inset:0;z-index:1;transform-origin:50% 100%}
.screen{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;visibility:hidden}
.screen.on{visibility:visible}
.screen::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}
.inner{position:relative;padding:0 16px 140px;display:flex;flex-direction:column;gap:28px}
.halo{position:absolute;left:-16px;right:-16px;top:0;height:340px;pointer-events:none;background:radial-gradient(70% 90% at 0% 0%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%);opacity:.9}
.nav{position:sticky;top:0;z-index:20;height:calc(50px + env(safe-area-inset-top,0px));margin:0 -16px -28px;padding:env(safe-area-inset-top,0px) 60px 0;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--mat);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);border-bottom:.5px solid var(--line);opacity:0;pointer-events:none;font:600 16px var(--font)}
.nav svg{color:var(--acc)}
.hd{padding:62px 50px 0 2px;transform-origin:0 100%}
.ey{display:flex;align-items:center;gap:7px;margin:0 0 10px;font:600 13px/1.2 var(--font);letter-spacing:.02em;color:var(--acc)}
.ey.n{color:var(--dim);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
h1{margin:0;font:750 34px/1.08 var(--font);font-weight:750;letter-spacing:-.03em;text-wrap:balance}
h2{margin:0;font:700 21px/1.2 var(--font);letter-spacing:-.02em}
h3{margin:0;font:600 16px/1.25 var(--font)}
.lede{margin:12px 0 0;font-size:17px;line-height:1.42;color:var(--mu);max-width:34ch;text-wrap:pretty}
.sec{display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 2px}
.sh small{color:var(--dim);font-size:13px}
.note{margin:0;padding:0 2px;font-size:13px;line-height:1.45;color:var(--dim)}

.card{position:relative;background:var(--card);border-radius:22px;box-shadow:0 1px 0 var(--line2) inset,0 10px 30px rgba(var(--shc),.12)}
.pad{padding:18px}
.list{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 1px 0 var(--line2) inset,0 10px 30px rgba(var(--shc),.1)}
.row{position:relative;display:flex;align-items:center;gap:13px;width:100%;min-height:62px;padding:12px 16px;transition:background .2s}
.row+.row::before{content:"";position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--line)}
.row.ind+.row.ind::before{left:66px}
button.row:active{background:var(--card2)}
.grow{flex:1;min-width:0}
.t1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font:650 16px/1.25 var(--font);font-weight:650}
.t2{margin-top:3px;font-size:14px;line-height:1.3;color:var(--mu)}
.rt{flex:none;text-align:right}.rt b{display:block;font:600 16px/1.25 var(--font)}.rt small{display:block;margin-top:3px;font-size:13px}
.chev{flex:none;color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;font:650 12px/1 var(--font);font-weight:650;letter-spacing:.01em;white-space:nowrap;background:var(--track);color:var(--mu)}
.pill.buy{background:color-mix(in srgb,var(--up) 15%,transparent);color:var(--up)}
.pill.sell{background:color-mix(in srgb,var(--dn) 15%,transparent);color:var(--dn)}
.pill.hold{background:color-mix(in srgb,var(--pf) 16%,transparent);color:var(--pf)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.acc{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--acc)) 14%,var(--card2));color:var(--c,var(--acc))}
.ico.sm{width:34px;height:34px;border-radius:10px}
.av{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card2);font:700 14px var(--font);color:var(--mu);letter-spacing:-.02em}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:50px;padding:0 20px;border-radius:15px;font:600 16px var(--font);background:var(--fg);color:var(--bg);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.btn:active{transform:scale(.97)}
.btn.w{width:100%}
.btn.soft{background:var(--card);color:var(--fg);box-shadow:0 0 0 .5px var(--line2) inset}
.btn.sm{min-height:34px;padding:0 14px;font-size:14px;border-radius:99px}
.btn.acc{background:var(--acc);color:var(--bg)}
.lnk{display:inline-flex;align-items:center;gap:3px;font:600 15px var(--font);color:var(--acc)}
.seg{position:relative;display:grid;grid-auto-columns:1fr;grid-auto-flow:column;padding:3px;border-radius:12px;background:var(--track);height:40px}
.seg button{position:relative;z-index:1;text-align:center;font:600 14px var(--font);color:var(--mu);border-radius:9px;transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--fg)}
.seg .knob{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.18),0 0 0 .5px var(--line2)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:99px;background:var(--card);box-shadow:0 0 0 .5px var(--line2) inset;font:600 14px var(--font);color:var(--mu);white-space:nowrap;transition:background .25s,color .25s}
.chip b{color:var(--fg);font-weight:650}
button.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}button.chip[aria-pressed="true"] b{color:var(--bg)}

/* home */
.prod{display:flex;gap:14px;align-items:flex-start;width:100%;padding:16px;text-align:left}
.prod .grow h3{display:flex;align-items:center;gap:8px}
.prod p{margin:4px 0 0;font-size:14.5px;line-height:1.4;color:var(--mu)}
.prod .meta{margin-top:10px;display:flex;align-items:center;gap:6px;font:600 13px var(--font);color:var(--c)}
.top{padding:20px;overflow:hidden}
.top::before{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--ai) 22%,transparent),transparent 70%);pointer-events:none}
.top>*{position:relative}
.sym{font:750 38px/1 var(--font);font-weight:750;letter-spacing:-.035em}
.lv3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;border-radius:16px;background:var(--card2);overflow:hidden}
.lv3>div{padding:12px 14px;min-width:0}.lv3>div+div{box-shadow:-.5px 0 0 var(--line2)}
.lv3 small{display:block;font:600 12px var(--font);letter-spacing:.02em;color:var(--dim)}
.lv3 b{display:block;margin-top:4px;font:650 17px var(--font);font-weight:650}
.rail{position:relative;height:30px;margin:18px 2px 0}
.rail .tk{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--dn) 55%,var(--track)) var(--e),color-mix(in srgb,var(--up) 55%,var(--track)) var(--e))}
.rail .mk{position:absolute;top:5px;width:2px;height:12px;margin-left:-1px;border-radius:2px;background:var(--mu)}
.rail .nw{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 3px var(--card),0 2px 8px rgba(0,0,0,.3)}
.rail span{position:absolute;top:20px;font:600 11.5px var(--font);color:var(--dim);white-space:nowrap;transform:translateX(-50%)}
.rail span.l{transform:none;left:0}.rail span.r{transform:none;right:0}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:.5px solid var(--line);font-size:14px;color:var(--mu)}
.foot b{color:var(--fg);font-weight:600}
.quote{margin:14px 0 0;font:500 17px/1.42 var(--font);color:var(--mu);text-wrap:pretty}
.quote b{color:var(--fg);font-weight:600}

/* proof strip */
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;border-radius:18px;overflow:hidden;background:var(--line)}
.proof>div{background:var(--card);padding:14px 12px;min-width:0}
.proof b{display:block;font:700 22px/1.1 var(--font);letter-spacing:-.02em}
.proof small{display:block;margin-top:4px;font-size:12px;line-height:1.3;color:var(--dim)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.steps>div{padding:14px 12px;border-radius:18px;background:var(--card);min-width:0;box-shadow:0 0 0 .5px var(--line) inset}
.steps i{display:grid;place-items:center;width:24px;height:24px;border-radius:8px;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font:700 12px var(--font);font-style:normal}
.steps b{display:block;margin-top:10px;font:650 14px/1.25 var(--font)}
.steps small{display:block;margin-top:4px;font-size:12.5px;line-height:1.35;color:var(--mu)}

/* x-ray search */
.srch{position:relative;z-index:5}
.sbox{display:flex;align-items:center;gap:10px;height:58px;padding:0 16px;border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line2) inset,0 14px 40px rgba(var(--shc),.16);transition:box-shadow .3s}
.sbox:focus-within{box-shadow:0 0 0 2px var(--acc) inset,0 14px 40px rgba(var(--shc),.2)}
.sbox svg{color:var(--acc);flex:none}
.sbox input{flex:1;min-width:0;height:56px;background:none;border:0;outline:none;color:var(--fg);font:500 18px var(--font)}
.sbox input::placeholder{color:var(--dim)}
.sug{position:absolute;left:0;right:0;top:64px;border-radius:18px;background:var(--card);box-shadow:0 0 0 .5px var(--line2) inset,0 20px 50px rgba(var(--shc),.35);overflow:hidden;transform-origin:50% 0}
.mini-ring{flex:none}
.scroller{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 14px;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.fcard{flex:0 0 150px;scroll-snap-align:start;scroll-margin-left:16px;padding:14px;border-radius:20px;background:var(--card);box-shadow:0 0 0 .5px var(--line) inset,0 8px 24px rgba(var(--shc),.1);display:flex;flex-direction:column;gap:10px;text-align:left}
.fcard b{font:700 16px var(--font)}.fcard small{display:block;font-size:12.5px;color:var(--mu);margin-top:2px}

/* pattern */
.pcard{display:block;width:100%;padding:16px;text-align:left}
.pcard .top2{display:flex;align-items:flex-start;gap:12px}
.spark{display:block;width:100%;height:74px;margin-top:12px}
.odds{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--line);font-size:13.5px;color:var(--mu)}
.odds b{color:var(--fg);font-weight:650}
.bar{position:relative;height:6px;border-radius:6px;background:var(--track);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--c,var(--acc));width:0;transition:width 1.1s cubic-bezier(.2,.9,.2,1)}
.vis .bar i,.bar.vis i{width:var(--w)}

/* x-ray result */
.price{font:750 40px/1 var(--font);font-weight:750;letter-spacing:-.03em}
.dial{position:relative;width:min(240px,70vw);margin:8px auto 0}
.dial svg{display:block;width:100%}
.dial .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial .c b{font:750 64px/1 var(--font);font-weight:750;letter-spacing:-.04em}
.dial .c span{margin-top:4px;font:600 13px var(--font);color:var(--dim)}
.leg{list-style:none;margin:0;padding:0}
.leg li{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:.5px solid var(--line)}
.leg li i{width:10px;height:10px;border-radius:3px}
.leg small{display:block;font-size:13px;line-height:1.3;color:var(--mu)}
.leg b{font:650 16px var(--font)}.leg b span{color:var(--dim);font-weight:500}
.kv{display:grid;grid-template-columns:1fr auto}
.kv>*{padding:13px 16px;border-top:.5px solid var(--line);font-size:15.5px}.kv>:nth-child(-n+2){border-top:0}
.kv span{color:var(--mu)}.kv b{text-align:right;font-weight:600}
.own{display:flex;height:12px;gap:2px;border-radius:6px;overflow:hidden}
.own i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.9,.2,1)}
.vis .own i{transform:none}
.lg2{display:grid;gap:10px;margin-top:14px;font-size:15px}
.lg2 span{display:flex;align-items:center;gap:10px}.lg2 b{margin-left:auto;font-weight:600}
.lg2 i{width:10px;height:10px;border-radius:3px}
.svgc{display:block;width:100%;height:auto;overflow:visible}
.svgc text{fill:var(--dim);font:500 11px var(--font)}.svgc .v{fill:var(--fg);font-weight:650}
.svgc rect.b{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.9,.2,1)}
.vis .svgc rect.b{transform:none}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.why li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.42;color:var(--mu)}
.why li svg{flex:none;margin-top:2px}
.tl{padding:2px 2px 0 8px}.tl div{position:relative;padding:0 0 18px 22px;border-left:1.5px solid var(--line2);font-size:15px;line-height:1.42;color:var(--mu)}
.tl div:last-child{border-color:transparent;padding-bottom:0}
.tl div::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent)}
.tl b{color:var(--fg);font-weight:600}
canvas.chart{display:block;width:100%;height:240px;touch-action:pan-y}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0)*60ms)}
.rv.vis{opacity:1;transform:none}

/* sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);border-radius:28px 28px 0 0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;visibility:hidden;box-shadow:0 -12px 60px rgba(0,0,0,.4)}
.grab{position:sticky;top:0;z-index:25;height:58px;margin:0 -16px 0;display:flex;align-items:center;padding:0 16px;background:var(--mat);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);touch-action:none;cursor:grab;border-radius:28px 28px 0 0}
.grab::before{content:"";position:absolute;left:50%;top:7px;width:38px;height:5px;margin-left:-19px;border-radius:5px;background:var(--line2)}
.grab b{position:absolute;left:60px;right:60px;top:23px;text-align:center;font:600 16px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{margin-left:auto;margin-top:8px;width:32px;height:32px;border-radius:50%;background:var(--track);display:grid;place-items:center;color:var(--mu)}
.sheet .inner{padding-top:0;padding-bottom:60px;gap:24px}
.sheet .hd{padding-top:8px}
.scrim{position:absolute;inset:0;z-index:38;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .4s}.scrim.on{opacity:1;pointer-events:auto}
.modal{position:absolute;left:0;right:0;bottom:0;z-index:42;background:var(--bg);border-radius:28px 28px 0 0;padding:22px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .5s cubic-bezier(.32,.72,0,1),visibility 0s .5s;box-shadow:0 -12px 60px rgba(0,0,0,.4)}
.modal.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.32,.72,0,1)}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.fld label{font:500 14px var(--font);color:var(--mu)}
.fld input{height:50px;border-radius:13px;border:0;background:var(--card);box-shadow:0 0 0 .5px var(--line2) inset;color:var(--fg);padding:0 14px;font:500 17px var(--font);width:100%}

function patSeries(p){
  var n=60,r=rng(hash(p.sym+"p")),L=p.level,last=p.now/L,out=[],x=.9,tests=[],k;
  for(k=0;k<p.tests;k++)tests.push(Math.round(6+k*(n-20)/Math.max(1,p.tests-1||1)));
  for(var i=0;i<n;i++){var tgt=.915;tests.forEach(function(t){var d=i-t;if(d>-6&&d<=0)tgt=.915+(.99-.915)*(1+d/6);if(d>0&&d<5)tgt=.99-(d/5)*.06});
    x+=(tgt-x)*.35+(r()-.5)*.018;out.push(Math.min(x,.993))}
  function ramp(a,b,from,to){for(var i=a;i<=b;i++){var t=(i-a)/Math.max(1,b-a);out[i]=lerp(from,to,t*t*(3-2*t))+(r()-.5)*.006}}
  if(p.stage==="Forming")ramp(n-7,n-1,out[n-7],last);
  if(p.stage==="Near")ramp(n-10,n-1,out[n-10],last);
  if(p.stage==="Breakout"){ramp(n-11,n-5,out[n-11],.986);ramp(n-4,n-1,.996,last)}
  if(p.stage==="Retest"){ramp(n-20,n-13,out[n-20],.99);ramp(n-12,n-7,1.0,1.06);ramp(n-6,n-1,1.055,last)}
  out[n-1]=last;return out.map(function(v){return v*L})
}

var CH=null;
function makeSeries(g,closed){
  var n=96,r=rng(hash(g.sym)),L=g.level,eI=closed?64:n-1-g.bars,end=closed?g.exit:g.now,
   K=[[0,.8*L],[Math.max(eI-36,4),.93*L],[eI-12,.975*L],[eI-1,.986*L],[eI,g.entry],[n-1,end]],out=[],j=0;
  for(var i=0;i<n;i++){while(j<K.length-2&&i>K[j+1][0])j++;var a=K[j],b=K[j+1],t=b[0]===a[0]?1:(i-a[0])/(b[0]-a[0]);
    var v=lerp(a[1],b[1],clamp(t,0,1))+(r()-.5)*L*(i<eI?.012:.014)*(i===eI||i===n-1?0:1);
    if(i<eI&&i>eI-40)v=Math.min(v,L*.996); if(i>=eI&&!closed)v=Math.max(v,g.stop*1.015); out.push(v)}
  return {v:out,eI:eI}
}

/* ======================= physics ======================= */
var SPR=[];
function Spring(x,k,c,on){this.x=x;this.t=x;this.v=0;this.k=k;this.c=c;this.on=on;this.done=null}
Spring.prototype.to=function(t,v,done){this.t=t;if(v!=null)this.v=v;this.done=done||null;if(RM){this.x=t;this.v=0;this.on(t);if(done)done();return}if(SPR.indexOf(this)<0)SPR.push(this)};
Spring.prototype.set=function(x){this.x=x;this.t=x;this.v=0;this.on(x);var i=SPR.indexOf(this);if(i>=0)SPR.splice(i,1)};
function stepSprings(dt){
  for(var i=SPR.length-1;i>=0;i--){var s=SPR[i],h=dt/4;
    for(var j=0;j<4;j++){var a=-s.k*(s.x-s.t)-s.c*s.v;s.v+=a*h;s.x+=s.v*h}
    if(Math.abs(s.v)<.02&&Math.abs(s.x-s.t)<.02){s.x=s.t;s.v=0;SPR.splice(i,1);s.on(s.x);if(s.done)s.done()}else s.on(s.x)}
}

function observe(root){
  if(IO)IO.disconnect();

  if(RM||!("IntersectionObserver" in window)){els.forEach(reveal);return}
  IO=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){reveal(e.target);IO.unobserve(e.target)}})},{root:root,threshold:.12});
  els.forEach(function(e){IO.observe(e)})
}
function reveal(el){

}

}

function cacheJelly(root){JL=$$(".jl",root).map(function(el){return {el:el,x:0,v:0}})}
var lastSt=0,vel=0;
function jelly(sc,dt){
  var st=sc.scrollTop,raw=(st-lastSt);lastSt=st;vel=lerp(vel,raw,.5);
  if(RM)return;var vh=sc.clientHeight,mid=vh*.5,sr=sc.getBoundingClientRect();
  JL.forEach(function(j){
    var r=j.el.getBoundingClientRect(),c=r.top-sr.top+r.height/2;if(c<-200||c>vh+200){if(j.x){j.x=0;j.v=0;j.el.style.translate=""}return}
    var f=.25+Math.min(Math.abs(c-mid)/vh,1)*.75,t=clamp(vel*f*.9,-22,22);
    var a=-320*(j.x-t)-22*j.v;j.v+=a*dt;j.x+=j.v*dt;
    var rx=Math.round(j.x);j.el.style.translate=rx?"0 "+rx+"px":""});
}

/* ---------- sheets with velocity-aware spring ---------- */
var shS=new Spring(1,210,27,function(p){var H=sheet.offsetHeight||800;sheet.style.transform="translate3d(0,"+(p*H).toFixed(1)+"px,0)";var o=1-clamp(p,0,1);screens.style.transform=o?"scale("+(1-.06*o).toFixed(4)+") translateY("+(8*o).toFixed(1)+"px)":"";screens.style.filter=o?"brightness("+(1-.38*o).toFixed(3)+")":"";screens.style.borderRadius=o?(30*o).toFixed(1)+"px":"";screens.style.overflow=o?"hidden":"";tabs.style.opacity=(1-o*.6).toFixed(2)});
shS.set(1);
function openSheet(html,after){sheet.innerHTML=html;sheet.scrollTop=0;sheet.style.visibility="visible";shS.to(0,0);observe(sheet);cacheJelly(sheet);if(after)after();setTimeout(function(){var b=$(".x",sheet);if(b)b.focus({preventScroll:true})},450)}
function closeSheet(v){stopChart();shS.to(1,v||0,function(){sheet.style.visibility="hidden";sheet.innerHTML="";var el=SCR[S.view].el;observe(el);cacheJelly(el)})}
function sheetOpen(){return sheet.style.visibility==="visible"&&shS.t===0}
function grab(t){return '<div class="grab" id="grab"><b>'+t+'</b><button class="x" data-act="close" aria-label="Close">'+ic("x",15,2.6)+'</button></div>'}
(function(){
  var y0=null,last=0,lt=0,v=0,H=1;
  sheet.addEventListener("pointerdown",function(e){var g=e.target.closest&&e.target.closest("#grab");if(!g||e.target.closest(".x"))return;y0=e.clientY;last=y0;lt=performance.now();v=0;H=sheet.offsetHeight;var i=SPR.indexOf(shS);if(i>=0)SPR.splice(i,1);try{g.setPointerCapture(e.pointerId)}catch(x){}});
  sheet.addEventListener("pointermove",function(e){if(y0===null)return;var now=performance.now(),dy=e.clientY-y0;v=(e.clientY-last)/Math.max(1,now-lt)*1000/H;last=e.clientY;lt=now;var p=dy<0?dy/H*.15:dy/H;shS.x=p;shS.on(p)});
  function end(){if(y0===null)return;y0=null;if(shS.x>.22||v>1.2)closeSheet(v);else shS.to(0,v)}
  sheet.addEventListener("pointerup",end);sheet.addEventListener("pointercancel",end);
})();
function openSig(id,closed){
  var g=null;if(closed){CLOSED.forEach(function(c){if(c.id===id)g=Object.assign({},c,{level:c.entry*.99,target:c.entry+2*(c.entry-c.stop),action:"BUY",state:"Closed",bars:0})})}else g=SIGS.filter(function(s){return s.id===id})[0];
  if(!g)return;openSheet(sigSheet(g,closed),function(){startChart(g,closed)})
}
function openAdd(){
  modal.innerHTML='<h2>Add a holding</h2><p class="mu" style="margin:6px 0 0;font-size:15px">Type what you bought. You can remove it any time.</p>'+
  '<form id="addf" novalidate><div class="fld"><label for="f-sym">Stock symbol</label><input id="f-sym" type="text" list="syms" placeholder="e.g. DIXON" autocomplete="off" autocapitalize="characters" style="text-transform:uppercase"><datalist id="syms">'+XR.map(function(d){return '<option value="'+d.sym+'">'}).join("")+'</datalist></div>'+
  '<div class="fld"><label for="f-qty">Quantity</label><input id="f-qty" inputmode="numeric" placeholder="10"></div><div class="fld"><label for="f-avg">Average buy price (₹)</label><input id="f-avg" inputmode="decimal" placeholder="1500"></div>'+
  '<p class="err" id="f-err" role="alert"></p><div style="display:flex;gap:10px"><button type="button" class="btn soft" data-act="mclose" style="flex:1">Cancel</button><button type="submit" class="btn acc" style="flex:1;--acc:var(--pf)">Add</button></div></form>';
  modal.classList.add("open");scrim.classList.add("on");
  setTimeout(function(){var f=$("#f-sym");if(f)f.focus({preventScroll:true})},450);
  $("#addf").addEventListener("submit",function(e){e.preventDefault();
    var sym=$("#f-sym").value.trim().toUpperCase().replace(/[^A-Z0-9&-]/g,""),q=Math.floor(+$("#f-qty").value),a=+$("#f-avg").value,er=$("#f-err");
    if(!sym){er.textContent="Enter a stock symbol.";return}if(!(q>0)){er.textContent="Quantity must be 1 or more.";return}if(!(a>0)){er.textContent="Enter the price you paid per share.";return}
    var ex=S.holdings.filter(function(h){return h.sym===sym})[0];
    if(ex){var tq=ex.qty+q;ex.avg=(ex.avg*ex.qty+a*q)/tq;ex.qty=tq}else S.holdings.push({sym:sym,qty:q,avg:a});
    saveH();closeModal();render("portfolio",true)})
}
function closeModal(){modal.classList.remove("open");scrim.classList.remove("on")}

/* ---------- X-Ray search: live suggestions + typed hints ---------- */
var hintT=null;
function bindSearch(){
  var inp=$("#xq"),sug=$("#sug");if(!inp)return;
  var hints=["Search a company","Try TRENT","Try “defence”","Try Infosys","Try “banks”"],hi=0,ci=0,del=false;
  clearTimeout(hintT);
  function tick(){if(!document.body.contains(inp))return;if(document.activeElement===inp||inp.value){inp.placeholder="Search a company";hintT=setTimeout(tick,900);return}
    var w=hints[hi];if(!del){ci++;if(ci>=w.length){del=true;hintT=setTimeout(tick,1600);inp.placeholder=w;return}}else{ci--;if(ci<=0){del=false;hi=(hi+1)%hints.length}}
    inp.placeholder=w.slice(0,ci)+(ci<w.length?"▏":"");hintT=setTimeout(tick,del?28:62)}
  if(!RM)hintT=setTimeout(tick,1400);
  function upd(){var h=sugHtml(inp.value);sug.innerHTML=h;sug.hidden=!h;if(h&&!RM){sug.animate([{opacity:0,transform:"scale(.97) translateY(-6px)"},{opacity:1,transform:"none"}],{duration:260,easing:"cubic-bezier(.2,.9,.2,1)"})}}
  inp.addEventListener("input",function(){S.xq=inp.value;upd()});
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){var b=$("[data-act=xr]",sug);if(b)b.click()}});
  inp.addEventListener("focus",upd);
  document.addEventListener("pointerdown",function(e){if(!e.target.closest(".srch"))sug.hidden=true},{capture:true});
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var a=t.getAttribute("data-act");
  if(a==="go"){if(sheetOpen())closeSheet();show(t.getAttribute("data-to"))}
  else if(a==="sig")openSig(t.getAttribute("data-id"),false);
  else if(a==="sigc")openSig(t.getAttribute("data-id"),true);
  else if(a==="xr"){var d=xrOf(t.getAttribute("data-sym"));if(d){var s=$("#sug");if(s)s.hidden=true;openSheet(xrSheet(d))}}
  else if(a==="pat"){var p=PAT.filter(function(x){return x.id===t.getAttribute("data-id")})[0];if(p)openSheet(patSheet(p))}
  else if(a==="close")closeSheet();
  else if(a==="xf"){S.xf=t.getAttribute("data-f");$$("#xseg button").forEach(function(b){b.setAttribute("aria-pressed",b===t)});segKnob($("#s-xray"));$("#xlist").innerHTML=xrRows(xrFilter());$$("#xlist .list",document).forEach(reveal);cacheJelly(SCR.xray.el)}
  else if(a==="xqf"){var i=$("#xq");i.value=t.getAttribute("data-q");S.xq=i.value;i.dispatchEvent(new Event("input"));i.focus({preventScroll:true})}
  else if(a==="sigtab"){S.sigTab=+t.getAttribute("data-i");render("signals",true)}
  else if(a==="pf"){S.pf=t.getAttribute("data-f");render("patterns",true)}
  else if(a==="add")openAdd();
  else if(a==="edit"){S.edit=!S.edit;render("portfolio",true)}
  else if(a==="mclose")closeModal();
  else if(a==="rm"){S.holdings.splice(+t.getAttribute("data-i"),1);saveH();render("portfolio",true)}
  else if(a==="replay"){try{location.reload()}catch(err){}}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){if(modal.classList.contains("open"))closeModal();else if(sheetOpen())closeSheet()}
  if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("role")==="button"){e.preventDefault();e.target.click()}
});
scrim.addEventListener("click",closeModal);
$("#themeBtn").addEventListener("click",function(){var r=document.documentElement,dark=(r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"))==="dark";r.setAttribute("data-theme",dark?"light":"dark")});

/* ---------- frame loop ---------- */
var dirtyNav=true,lt0=performance.now();
function frame(now){
  var dt=clamp((now-lt0)/1000,0,1/30);lt0=now;
  stepSprings(dt);
  var sc=sheet.style.visibility==="visible"?sheet:SCR[S.view].el,st=sc.scrollTop;
  jelly(sc,dt);
  var inner=$(".inner",sc);
  if(inner){var nav=$(".nav",inner);if(nav){var b=clamp((st-70)/24,0,1);nav.style.opacity=b.toFixed(2)}
    var hd=$(".hd",inner);if(hd&&st<0)hd.style.transform="scale("+(1+clamp(-st/600,0,.2)).toFixed(3)+")";else if(hd&&hd.style.transform&&hd.classList.contains("vis"))hd.style.transform="";
    var ha=$(".halo",inner);if(ha)ha.style.transform="translate3d(0,"+Math.round(-st*.35)+"px,0)"}
  requestAnimationFrame(frame)
}
show("home");requestAnimationFrame(frame);
})();
</script>
<script>
(function(){
"use strict";
var host=document.getElementById("film-host"),tpl=document.getElementById("film-tpl");if(!host||!tpl)return;var root=host.attachShadow({mode:"open"});root.appendChild(tpl.content.cloneNode(true));var film=root.getElementById("film");if(!film)return;
function syncTheme(){var t=document.documentElement.getAttribute("data-theme");if(t)host.setAttribute("data-theme",t);else host.removeAttribute("data-theme")}syncTheme();new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))},rng=function(p,a,b){return clamp((p-a)/(b-a),0,1)},ease=function(t){return t*t*(3-2*t)},eo=function(t){return 1-Math.pow(1-t,3)};
var $=function(s,r){return (r||root).querySelector(s)},$$=function(s,r){return Array.prototype.slice.call((r||root).querySelectorAll(s))};
var vh=innerHeight,vw=innerWidth,sm=0,mx=0,my=0,tmx=0,tmy=0,alive=true;
var bar=$("#fbar"),ph=$("#ph"),aHero=$("#aHero"),aHint=$("#aHint"),cards=$$(".fc",film);

/* pillars (Trent sample from the DNA page) */
var PIL=[["Quality",86,"var(--buy)"],["Growth",92,"var(--cyan)"],["Value",34,"var(--amber)"],["Momentum",84,"var(--violet)"],["Safety",76,"var(--pink)"],["Ownership",72,"var(--buy)"]];
var pcs=$("#pcs");
PIL.forEach(function(p,i){var d=document.createElement("div");d.className="pc";d.style.setProperty("--c",p[2]);d.style.setProperty("--v",p[1]);
  d.innerHTML='<div class="pc-in" style="--d:'+(-i*.9)+'s"><small>'+p[0]+'<b>'+p[1]+'</b></small><i><s></s></i></div>';pcs.appendChild(d)});
var pcEls=$$(".pc",film);
/* illustrative 20 trades: 11 winners summing +16.2R, 9 losers at -1R  => +0.36R average */
var R20=[-1,.4,-1,2,.6,-1,2,-1,.8,2.4,-1,.5,2,-1,1.2,2.3,-1,-1,2,-1],rb=$("#rbars");
R20.forEach(function(r){var i=document.createElement("i");var up=r>0;i.style.setProperty("--h",up?(r/2.4*100):42);i.style.setProperty("--c",up?"var(--buy)":"var(--sell)");rb.appendChild(i)});
var rEls=$$("i",rb);

function measure(){vh=film.clientHeight;vw=film.clientWidth}
addEventListener("resize",measure);window.__filmReplay=function(){location.reload()};
if(!RM)addEventListener("pointermove",function(e){if(e.pointerType==="mouse"){tmx=e.clientX/innerWidth-.5;tmy=e.clientY/innerHeight-.5}});

function reveals(s,p){
  $$("[data-r]",s).forEach(function(el){
    var a=el.getAttribute("data-r").split(",").map(Number),t=eo(rng(p,a[0],a[1])),o=0;
    var oo=el.getAttribute("data-o");if(oo){var b=oo.split(",").map(Number);o=ease(rng(p,b[0],b[1]))}
    var k=t*(1-o);el.style.opacity=k.toFixed(3);
    el.style.transform="translate3d(0,"+(((1-t)*36)-(o*30)).toFixed(1)+"px,0) scale("+(0.97+0.03*t).toFixed(3)+")";
    el.style.filter=(1-k)>.02?"blur("+((1-k)*10).toFixed(1)+"px)":"none"})}

var scn=$$(".scn",film),U={};
U.sA=function(s,p){
  var t=ease(rng(p,.05,.36)),shrink=ease(rng(p,.5,.78));
  ph.style.transform="translate(-50%,-50%) translate3d("+(mx*-14).toFixed(1)+"px,"+(((1-t)*vh*.82)+shrink*vh*(vw<600?.07:0)+my*-10).toFixed(1)+"px,0) perspective(1400px) rotateX("+(((1-t)*42)+my*-4).toFixed(2)+"deg) rotateY("+((mx*10)+(1-t)*-14).toFixed(2)+"deg) scale("+(.7+.3*t-shrink*.1).toFixed(3)+")";
  ph.style.setProperty("--gl",(p*160-20).toFixed(0));ph.style.setProperty("--dr",ease(rng(p,.22,.5)).toFixed(3));
  var o=ease(rng(p,.08,.3));aHero.style.opacity=(1-o).toFixed(3);aHero.style.transform="translate3d(0,"+(-o*60).toFixed(1)+"px,0) scale("+(1+o*.22).toFixed(3)+")";aHero.style.filter=o>.02?"blur("+(o*14).toFixed(1)+"px)":"none";
  aHint.style.opacity=(1-rng(p,0,.04)).toFixed(2);
  var e=ease(rng(p,.5,.86)),W=Math.min(vw,1100)/2,H=vh/2,out=ease(rng(p,.93,1));
  cards.forEach(function(c,i){var x=+c.dataset.x,y=+c.dataset.y,z=+c.dataset.z,r=+c.dataset.rot,st=ease(rng(p,.5+i*.035,.86));
    var nar=vw<600,tx=x*(nar?.74:1)*W*st+mx*z*.22,ty=y*(nar&&y>.6?.8:1)*H*st+my*z*.18;
    c.style.opacity=(st*(1-out)).toFixed(3);
    c.style.transform="translate(-50%,-50%) translate3d("+tx.toFixed(1)+"px,"+ty.toFixed(1)+"px,"+(z*st).toFixed(0)+"px) rotate("+(r*st).toFixed(2)+"deg) scale("+(.35+.65*st+z/1200*st).toFixed(3)+")"});
  ph.style.opacity=(1-out).toFixed(3);
};
U.sB=function(s,p){
  var g=ease(rng(p,.1,.78)),rw=$("#ringwrap");
  $("#rfg").style.strokeDashoffset=(565.5*(1-.757*g)).toFixed(1);
  $("#sc").textContent=Math.round(76*g);
  var R=Math.min(Math.min(vw,820)*.42,vh*.33),base=-Math.PI/2;
  pcEls.forEach(function(el,i){var st=ease(rng(p,.12+i*.085,.3+i*.085)),a=base+i*Math.PI*2/6,ex=Math.cos(a)*R*(vw<600?.6:1.35),ey=Math.sin(a)*R*.98;
    el.style.opacity=st.toFixed(3);el.style.transform="translate3d("+((ex*st)+mx*(10+i*3)).toFixed(1)+"px,"+((ey*st)+my*(8+i*2)).toFixed(1)+"px,"+(st*60).toFixed(0)+"px) scale("+(.4+.6*st).toFixed(3)+")";
    el.style.setProperty("--k",st.toFixed(3));$("s",el).style.setProperty("--k",st.toFixed(3))});
  rw.style.transform="translate3d(0,0,0) scale("+(.82+.18*ease(rng(p,0,.2))).toFixed(3)+")";
  rw.style.opacity=(ease(rng(p,0,.1))*(1-ease(rng(p,.92,1)))).toFixed(3);
};
U.sC=function(s,p){
  var a=eo(rng(p,.1,.5));
  $("#n1").textContent=Math.round(54*a)+"%";$("#n2").textContent="+"+(0.36*a).toFixed(2)+"R";$("#n3").textContent=Math.round(423*a);
  $(".stats3",s).style.transform="translate3d(0,"+(-ease(rng(p,.5,.7))*vh*.06).toFixed(1)+"px,0)";
  rEls.forEach(function(el,i){var k=ease(rng(p,.42+i*.012,.62+i*.012));el.style.setProperty("--k",k.toFixed(3))});
  $(".stats3",s).style.opacity=(ease(rng(p,0,.1))).toFixed(3);
};
U.sD=function(s,p){var o=$("#orb");o.style.transform="scale("+(.5+.7*ease(rng(p,0,.7))).toFixed(3)+") rotate("+(p*160).toFixed(0)+"deg)";o.style.opacity=(.15+.5*ease(rng(p,0,.5))).toFixed(3)};

function loop(){
  if(!alive)return;
  sm+=(film.scrollTop-sm)*(RM?1:.13);mx+=(tmx-mx)*.07;my+=(tmy-my)*.07;
  var tot=film.scrollHeight-vh;bar.style.transform="scaleX("+(tot>0?clamp(sm/tot,0,1):0).toFixed(4)+")";
  var aur=$(".f-aur",film);aur.style.transform="translate3d("+(mx*-40).toFixed(1)+"px,"+(-sm*.12).toFixed(1)+"px,0)";
  scn.forEach(function(s){var h=s.offsetHeight-vh,p=clamp((sm-s.offsetTop)/h,0,1);if(sm<s.offsetTop-vh||sm>s.offsetTop+s.offsetHeight)return;U[s.id](s,p);reveals(s,p)});
  requestAnimationFrame(loop)}
function leave(){if(!alive)return;alive=false;film.classList.add("gone");try{document.dispatchEvent(new CustomEvent("film:leave"))}catch(e){}setTimeout(function(){host.hidden=true},1200)}
$("#fskip").addEventListener("click",leave);$("#fenter").addEventListener("click",leave);
film.addEventListener("keydown",function(e){if(e.key==="Escape")leave()});
measure();loop();
try{film.focus({preventScroll:true})}catch(e){}
})();
</script>
